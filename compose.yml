services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    working_dir: /app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/biomarker_db
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=biomarker_db
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      # docker inspect --format "{{json .State.Health }}" biomarker_graph_api-db-1
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - 8080:8080

volumes:
  db_data:
